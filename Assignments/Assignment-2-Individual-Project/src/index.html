<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrepPulse — Campus Placement Preparation Portal</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX support -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root">
    <div style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; color:#64748b;">
      Loading PrepPulse Placement Portal...
    </div>
  </div>

  <!-- Embedded Data & Standalone React App Runner for instant zero-dependency browser preview -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Fetch data.json or fallback to embedded portal data
    async function initApp() {
      let portalData = null;
      try {
        const res = await fetch('./data.json');
        if (res.ok) portalData = await res.json();
      } catch (e) {
        console.log("Local file protocol detected, loading embedded dataset");
      }

      if (!portalData) {
        portalData = window.PREP_DATA;
      }

      function Navbar({ portalInfo, activeTab, setActiveTab }) {
        const tabs = [
          { id: 'dashboard', label: 'Dashboard', icon: '📊' },
          { id: 'companies', label: 'Company Tracks', icon: '🏢' },
          { id: 'dsa', label: 'DSA Practice', icon: '💻' },
          { id: 'aptitude', label: 'Aptitude Quiz', icon: '📝' },
          { id: 'core', label: 'Core CS Notes', icon: '📚' },
          { id: 'interview', label: 'Interview Prep', icon: '🎙️' },
          { id: 'checklist', label: 'Checklist', icon: '✅' }
        ];

        return (
          <header className="navbar-wrapper">
            <nav className="navbar">
              <div className="nav-container">
                <div className="brand-section">
                  <div className="brand-icon">P</div>
                  <div className="brand-text">
                    <h1>{portalInfo.title}</h1>
                    <span>{portalInfo.tagline}</span>
                  </div>
                </div>
                <div className="nav-user-badge">
                  <span>👤 {portalInfo.studentName}</span>
                  <span>•</span>
                  <span>{portalInfo.studentId}</span>
                </div>
              </div>
            </nav>
            <div className="nav-tabs">
              <div className="tabs-container">
                {tabs.map((tab) => (
                  <button
                    key={tab.id}
                    className={`tab-btn ${activeTab === tab.id ? 'active' : ''}`}
                    onClick={() => setActiveTab(tab.id)}
                  >
                    <span>{tab.icon}</span>
                    <span>{tab.label}</span>
                  </button>
                ))}
              </div>
            </div>
          </header>
        );
      }

      function Dashboard({ portalInfo, stats, readinessScore, completedDsaCount, completedChecklistCount, totalChecklistCount, setActiveTab }) {
        return (
          <div className="dashboard-view">
            <div className="hero-banner">
              <div className="hero-content">
                <span className="hero-badge">Campus Recruitment Season {portalInfo.academicYear}</span>
                <h2 className="hero-title">Crack Your Dream Placement with PrepPulse</h2>
                <p className="hero-subtitle">
                  Curated preparation paths for product engineering and service leaders. Master Data Structures,
                  ace Aptitude tests, revise Core CS fundamentals, and prepare for HR interviews.
                </p>
                <div className="hero-stats-grid">
                  <div className="hero-stat-card">
                    <div className="hero-stat-number">{stats.totalProblems}+</div>
                    <div className="hero-stat-label">Coding Challenges</div>
                  </div>
                  <div className="hero-stat-card">
                    <div className="hero-stat-number">{stats.companyTracks}</div>
                    <div className="hero-stat-label">Company Roadmaps</div>
                  </div>
                  <div className="hero-stat-card">
                    <div className="hero-stat-number">{stats.coreSubjects}</div>
                    <div className="hero-stat-label">Core Subjects</div>
                  </div>
                  <div className="hero-stat-card">
                    <div className="hero-stat-number">{stats.aptitudeQuestions}</div>
                    <div className="hero-stat-label">Practice Tests</div>
                  </div>
                </div>
              </div>
            </div>

            <div className="readiness-card">
              <div className="readiness-info">
                <h3>Your Placement Readiness Score</h3>
                <p>Based on {completedDsaCount} DSA solved & {completedChecklistCount} of {totalChecklistCount} milestones completed.</p>
              </div>
              <div className="readiness-progress-wrapper">
                <div className="progress-bar-container">
                  <div className="progress-bar-fill" style={{ width: `${readinessScore}%` }}></div>
                </div>
                <span className="readiness-percentage">{readinessScore}%</span>
              </div>
            </div>

            <div className="section-header">
              <h2>Quick Access Modules</h2>
              <p>Jump directly into high-impact preparation domains</p>
            </div>

            <div className="quick-cards-grid">
              <div className="quick-card" onClick={() => setActiveTab('companies')}>
                <div className="quick-card-icon" style={{ background: '#e0f2fe', color: '#0284c7' }}>🏢</div>
                <h4>Target Company Tracks</h4>
                <p>Explore recruitment rounds, CTC brackets, and top patterns for Amazon, Google, Microsoft, TCS, and more.</p>
                <span className="quick-card-link">View Company Guides →</span>
              </div>
              <div className="quick-card" onClick={() => setActiveTab('dsa')}>
                <div className="quick-card-icon" style={{ background: '#fef3c7', color: '#d97706' }}>💻</div>
                <h4>DSA & Coding Drills</h4>
                <p>Practice frequently asked interview problems with hints, problem statements, and complete solution code.</p>
                <span className="quick-card-link">Start Coding →</span>
              </div>
              <div className="quick-card" onClick={() => setActiveTab('aptitude')}>
                <div className="quick-card-icon" style={{ background: '#dcfce7', color: '#16a34a' }}>📝</div>
                <h4>Interactive Aptitude Quiz</h4>
                <p>Timed practice tests covering Quantitative Aptitude, Logical Reasoning, and Technical MCQs with instant scoring.</p>
                <span className="quick-card-link">Take Quiz →</span>
              </div>
              <div className="quick-card" onClick={() => setActiveTab('core')}>
                <div className="quick-card-icon" style={{ background: '#ede9fe', color: '#7c3aed' }}>📚</div>
                <h4>Core CS Flashcards</h4>
                <p>Rapid revision for DBMS (ACID, Normalization), OS (Deadlocks, Paging), Networks (TCP/UDP), and OOPs.</p>
                <span className="quick-card-link">Revise Fundamentals →</span>
              </div>
              <div className="quick-card" onClick={() => setActiveTab('interview')}>
                <div className="quick-card-icon" style={{ background: '#fce7f3', color: '#db2777' }}>🎙️</div>
                <h4>HR & Behavioral Prep</h4>
                <p>Master the STAR method for behavioral rounds, sample responses to tricky questions, and interviewer tips.</p>
                <span className="quick-card-link">Read Interview Prep →</span>
              </div>
              <div className="quick-card" onClick={() => setActiveTab('checklist')}>
                <div className="quick-card-icon" style={{ background: '#f1f5f9', color: '#475569' }}>✅</div>
                <h4>Placement Checklist</h4>
                <p>Stay organized with an interactive tracker for resumes, project deployments, and technical milestones.</p>
                <span className="quick-card-link">Track Checklist →</span>
              </div>
            </div>
          </div>
        );
      }

      function CompanyTracks({ companies }) {
        const [selectedDifficulty, setSelectedDifficulty] = useState('All');
        const filtered = companies.filter(c => selectedDifficulty === 'All' || c.difficulty === selectedDifficulty);

        return (
          <div className="company-tracks-view">
            <div className="section-header">
              <h2>Company Recruitment Tracks</h2>
              <p>In-depth roadmaps, compensation tiers, and evaluation rounds for target hiring partners</p>
            </div>
            <div className="dsa-controls">
              <div style={{ fontWeight: 600, color: 'var(--text-muted)', fontSize: '0.9rem' }}>
                Showing {filtered.length} of {companies.length} Companies
              </div>
              <div className="filter-buttons">
                {['All', 'Hard', 'Medium'].map(diff => (
                  <button
                    key={diff}
                    className={`filter-btn ${selectedDifficulty === diff ? 'active' : ''}`}
                    onClick={() => setSelectedDifficulty(diff)}
                  >
                    {diff === 'All' ? 'All Tiers' : `${diff} Tier`}
                  </button>
                ))}
              </div>
            </div>
            <div className="companies-grid">
              {filtered.map(c => (
                <div key={c.id} className="company-card">
                  <div className="company-card-header">
                    <div>
                      <h3 className="company-name">{c.name}</h3>
                      <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>{c.role}</span>
                    </div>
                    <span className="company-badge">{c.badge}</span>
                  </div>
                  <div className="company-meta">
                    <div className="meta-row">
                      <span className="meta-label">CTC Range:</span>
                      <span className="meta-value" style={{ color: 'var(--success)' }}>{c.package}</span>
                    </div>
                    <div className="meta-row">
                      <span className="meta-label">Evaluation Difficulty:</span>
                      <span className={`difficulty-badge difficulty-${c.difficulty}`}>{c.difficulty}</span>
                    </div>
                  </div>
                  <div className="company-rounds">
                    <h5>Hiring Workflow ({c.rounds.length} Rounds)</h5>
                    <div className="rounds-timeline">
                      {c.rounds.map(r => (
                        <div key={r.round} className="round-step">
                          <span className="round-num">{r.round}</span>
                          <div className="round-content">
                            <strong>{r.name}</strong>
                            <span>{r.detail}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                  <div className="hot-topics-tags">
                    {c.hotTopics.map((t, i) => <span key={i} className="topic-tag">#{t}</span>)}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function DsaPractice({ questions, completedIds, onToggleComplete, onSelectQuestion }) {
        const [searchTerm, setSearchTerm] = useState('');
        const [selectedCategory, setSelectedCategory] = useState('All');
        const [selectedDifficulty, setSelectedDifficulty] = useState('All');

        const categories = ['All', 'Arrays', 'Strings', 'Linked Lists', 'Trees', 'Dynamic Programming', 'Sorting & Searching'];
        const difficulties = ['All', 'Easy', 'Medium', 'Hard'];

        const filtered = questions.filter(q => {
          const matchSearch = q.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
            q.companies.some(c => c.toLowerCase().includes(searchTerm.toLowerCase()));
          const matchCat = selectedCategory === 'All' || q.category === selectedCategory;
          const matchDiff = selectedDifficulty === 'All' || q.difficulty === selectedDifficulty;
          return matchSearch && matchCat && matchDiff;
        });

        return (
          <div className="dsa-practice-view">
            <div className="section-header">
              <h2>Data Structures & Algorithm Drills</h2>
              <p>Curated problems frequently encountered in campus coding rounds & technical interviews</p>
            </div>
            <div className="dsa-controls">
              <input
                type="text"
                className="search-input"
                placeholder="🔍 Search problems by title or company (e.g. Amazon, Kadane)..."
                value={searchTerm}
                onChange={e => setSearchTerm(e.target.value)}
              />
              <div className="filter-buttons">
                {difficulties.map(diff => (
                  <button
                    key={diff}
                    className={`filter-btn ${selectedDifficulty === diff ? 'active' : ''}`}
                    onClick={() => setSelectedDifficulty(diff)}
                  >
                    {diff}
                  </button>
                ))}
              </div>
            </div>
            <div style={{ display: 'flex', gap: '0.4rem', flexWrap: 'wrap', marginBottom: '1.25rem' }}>
              {categories.map(cat => (
                <button
                  key={cat}
                  className={`filter-btn ${selectedCategory === cat ? 'active' : ''}`}
                  onClick={() => setSelectedCategory(cat)}
                  style={{ fontSize: '0.75rem', padding: '0.3rem 0.6rem' }}
                >
                  {cat}
                </button>
              ))}
            </div>
            <div className="problems-list">
              {filtered.map(q => {
                const isDone = completedIds.includes(q.id);
                return (
                  <div key={q.id} className={`problem-card ${isDone ? 'completed' : ''}`}>
                    <div className="problem-left">
                      <div
                        className={`checkbox-round ${isDone ? 'checked' : ''}`}
                        onClick={() => onToggleComplete(q.id)}
                      >
                        {isDone ? '✓' : ''}
                      </div>
                      <div className="problem-details">
                        <h4>{q.title}</h4>
                        <div className="problem-tags">
                          <span className={`difficulty-badge difficulty-${q.difficulty}`}>{q.difficulty}</span>
                          <span className="category-badge">{q.category}</span>
                          {q.companies.map((c, idx) => <span key={idx} className="topic-tag">{c}</span>)}
                        </div>
                      </div>
                    </div>
                    <button className="view-solution-btn" onClick={() => onSelectQuestion(q)}>
                      View Solution & Code
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      function AptitudeQuiz({ quizzes }) {
        const [currentIndex, setCurrentIndex] = useState(0);
        const [selectedAnswers, setSelectedAnswers] = useState({});
        const [isSubmitted, setIsSubmitted] = useState(false);

        const currentQ = quizzes[currentIndex];

        const handleSelect = (idx) => {
          if (isSubmitted) return;
          setSelectedAnswers({ ...selectedAnswers, [currentIndex]: idx });
        };

        const score = quizzes.reduce((acc, q, idx) => (selectedAnswers[idx] === q.correctIndex ? acc + 1 : acc), 0);

        return (
          <div className="quiz-wrapper">
            <div className="section-header" style={{ textAlign: 'center' }}>
              <h2>Interactive Aptitude & Technical Quiz</h2>
              <p>Test your speed and accuracy in quantitative, logical, and core engineering questions</p>
            </div>
            {!isSubmitted ? (
              <div className="quiz-card">
                <div className="quiz-header">
                  <span className="quiz-counter">Question {currentIndex + 1} of {quizzes.length}</span>
                  <span className="quiz-category-tag">{currentQ.category}</span>
                </div>
                <h3 className="question-text">{currentQ.question}</h3>
                <div className="options-grid">
                  {currentQ.options.map((opt, optIdx) => {
                    const isSelected = selectedAnswers[currentIndex] === optIdx;
                    return (
                      <button
                        key={optIdx}
                        className={`option-btn ${isSelected ? 'selected' : ''}`}
                        onClick={() => handleSelect(optIdx)}
                      >
                        <span style={{ fontWeight: 700, width: '24px' }}>{String.fromCharCode(65 + optIdx)}.</span>
                        <span>{opt}</span>
                      </button>
                    );
                  })}
                </div>
                <div className="quiz-actions">
                  <button
                    className="primary-btn"
                    style={{ background: '#f1f5f9', color: '#475569' }}
                    disabled={currentIndex === 0}
                    onClick={() => setCurrentIndex(prev => prev - 1)}
                  >
                    ← Previous
                  </button>
                  {currentIndex < quizzes.length - 1 ? (
                    <button className="primary-btn" onClick={() => setCurrentIndex(prev => prev + 1)}>
                      Next →
                    </button>
                  ) : (
                    <button className="primary-btn" style={{ background: 'var(--success)' }} onClick={() => setIsSubmitted(true)}>
                      Submit Quiz ✓
                    </button>
                  )}
                </div>
              </div>
            ) : (
              <div className="quiz-card score-result-card">
                <div className="score-badge-circle">{score} / {quizzes.length}</div>
                <h3>Quiz Completed!</h3>
                <p style={{ color: 'var(--text-muted)', marginBottom: '1.5rem' }}>
                  You scored {Math.round((score / quizzes.length) * 100)}% on this assessment.
                </p>
                <button
                  className="primary-btn"
                  onClick={() => { setSelectedAnswers({}); setCurrentIndex(0); setIsSubmitted(false); }}
                >
                  🔄 Retake Quiz
                </button>
                <div style={{ textAlign: 'left', marginTop: '2rem', display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                  {quizzes.map((q, idx) => {
                    const userAns = selectedAnswers[idx];
                    const isCorrect = userAns === q.correctIndex;
                    return (
                      <div key={q.id} style={{ padding: '1rem', background: '#f8fafc', borderRadius: '8px', border: '1px solid var(--border)' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.4rem' }}>
                          <strong>Q{idx + 1}. {q.question}</strong>
                          <span style={{ fontWeight: 700, color: isCorrect ? 'var(--success)' : 'var(--danger)' }}>
                            {isCorrect ? '✓ Correct' : '✗ Incorrect'}
                          </span>
                        </div>
                        <div style={{ fontSize: '0.85rem', color: 'var(--success)' }}>
                          Correct: {q.options[q.correctIndex]}
                        </div>
                        <div className="explanation-box">💡 <strong>Explanation:</strong> {q.explanation}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        );
      }

      function CoreSubjects({ subjects }) {
        const [activeSubject, setActiveSubject] = useState('all');
        const filtered = subjects.filter(s => activeSubject === 'all' || s.id === activeSubject);

        return (
          <div className="core-subjects-view">
            <div className="section-header">
              <h2>Core Computer Science Fundamentals</h2>
              <p>Essential theoretical revision for DBMS, Operating Systems, Computer Networks, and OOPs</p>
            </div>
            <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1.5rem', flexWrap: 'wrap' }}>
              <button
                className={`filter-btn ${activeSubject === 'all' ? 'active' : ''}`}
                onClick={() => setActiveSubject('all')}
              >
                All Subjects
              </button>
              {subjects.map(s => (
                <button
                  key={s.id}
                  className={`filter-btn ${activeSubject === s.id ? 'active' : ''}`}
                  onClick={() => setActiveSubject(s.id)}
                >
                  {s.name.split('(')[0]}
                </button>
              ))}
            </div>
            <div className="subjects-container">
              {filtered.map(s => (
                <div key={s.id} className="subject-block">
                  <div className="subject-header">
                    <div className="subject-color-bar" style={{ background: s.color }}></div>
                    <h3>{s.name}</h3>
                  </div>
                  <div className="concepts-grid">
                    {s.concepts.map((c, idx) => (
                      <div key={idx} className="concept-card">
                        <h4>{c.title}</h4>
                        <p>{c.summary}</p>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function InterviewGuide({ questions }) {
        const [expandedId, setExpandedId] = useState(1);

        return (
          <div className="interview-guide-view">
            <div className="section-header">
              <h2>HR & Behavioral Interview Preparation</h2>
              <p>Master situational and behavioral questions using the STAR framework with sample model responses</p>
            </div>
            <div className="interview-guide-grid">
              {questions.map(q => {
                const isExpanded = expandedId === q.id;
                return (
                  <div key={q.id} className="interview-card">
                    <div className="interview-card-header">
                      <span className="interview-category">{q.category}</span>
                      <button
                        onClick={() => setExpandedId(isExpanded ? null : q.id)}
                        style={{ background: 'none', border: 'none', color: 'var(--primary)', fontWeight: 600, cursor: 'pointer' }}
                      >
                        {isExpanded ? 'Collapse ▲' : 'Expand Sample Answer ▼'}
                      </button>
                    </div>
                    <h3>{q.question}</h3>
                    <div className="strategy-box">🎯 <strong>Strategy:</strong> {q.strategy}</div>
                    {isExpanded && (
                      <div className="sample-answer-box">
                        <div style={{ fontWeight: 700, marginBottom: '0.4rem', color: 'var(--primary)' }}>💬 Sample Answer:</div>
                        <p>{q.sampleAnswer}</p>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      function ChecklistTracker({ checklist, onToggleItem, completedCount, totalCount }) {
        const percentage = Math.round((completedCount / totalCount) * 100);

        return (
          <div className="checklist-wrapper">
            <div className="section-header" style={{ textAlign: 'center' }}>
              <h2>Placement Preparation Checklist</h2>
              <p>Track your essential milestones from resume building to final mock interviews</p>
            </div>
            <div className="checklist-card">
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
                <div>
                  <h3 style={{ fontSize: '1.15rem', fontWeight: 700 }}>Milestone Progress</h3>
                  <span style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>
                    {completedCount} of {totalCount} tasks completed
                  </span>
                </div>
                <span style={{ fontSize: '1.25rem', fontWeight: 800, color: 'var(--primary)' }}>
                  {percentage}%
                </span>
              </div>
              <div className="progress-bar-container" style={{ marginBottom: '1.5rem', height: '10px' }}>
                <div className="progress-bar-fill" style={{ width: `${percentage}%` }}></div>
              </div>
              <div className="checklist-items">
                {checklist.map(item => (
                  <div
                    key={item.id}
                    className={`checklist-item ${item.done ? 'checked' : ''}`}
                    onClick={() => onToggleItem(item.id)}
                  >
                    <div className="checklist-item-left">
                      <div className={`checkbox-round ${item.done ? 'checked' : ''}`}>
                        {item.done ? '✓' : ''}
                      </div>
                      <span style={{ fontSize: '0.95rem', fontWeight: 500 }}>{item.task}</span>
                    </div>
                    <span className="checklist-category-badge">{item.category}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }

      function QuestionModal({ question, onClose }) {
        const [showHint, setShowHint] = useState(false);
        const [copied, setCopied] = useState(false);
        if (!question) return null;

        return (
          <div className="modal-overlay" onClick={onClose}>
            <div className="modal-content" onClick={e => e.stopPropagation()}>
              <div className="modal-header">
                <div>
                  <h3>{question.title}</h3>
                  <div style={{ display: 'flex', gap: '0.5rem', marginTop: '0.35rem' }}>
                    <span className={`difficulty-badge difficulty-${question.difficulty}`}>{question.difficulty}</span>
                    <span className="category-badge">{question.category}</span>
                  </div>
                </div>
                <button className="modal-close-btn" onClick={onClose}>&times;</button>
              </div>
              <div className="modal-body">
                <div className="modal-section">
                  <h5>Problem Statement</h5>
                  <p style={{ fontSize: '0.95rem', lineHeight: '1.6' }}>{question.description}</p>
                </div>
                <div className="modal-section">
                  <button
                    onClick={() => setShowHint(!showHint)}
                    style={{ background: '#fef3c7', border: '1px solid #fde68a', color: '#b45309', padding: '0.35rem 0.75rem', borderRadius: '6px', fontSize: '0.8rem', fontWeight: 600, cursor: 'pointer', marginBottom: '0.5rem' }}
                  >
                    {showHint ? '🙈 Hide Hint' : '💡 Need a Hint? Click Here'}
                  </button>
                  {showHint && <div className="modal-hint-box">{question.hint}</div>}
                </div>
                <div className="modal-section">
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.5rem' }}>
                    <h5>Optimal Solution (JavaScript / ES6)</h5>
                    <button
                      onClick={() => { navigator.clipboard.writeText(question.solutionCode); setCopied(true); setTimeout(() => setCopied(false), 2000); }}
                      style={{ background: 'none', border: '1px solid var(--border)', padding: '0.2rem 0.6rem', borderRadius: '4px', fontSize: '0.75rem', cursor: 'pointer' }}
                    >
                      {copied ? '✓ Copied' : '📋 Copy Code'}
                    </button>
                  </div>
                  <pre className="code-container"><code>{question.solutionCode}</code></pre>
                </div>
              </div>
            </div>
          </div>
        );
      }

      function MainApp() {
        const [activeTab, setActiveTab] = useState('dashboard');
        const [selectedQuestion, setSelectedQuestion] = useState(null);
        const [completedDsaIds, setCompletedDsaIds] = useState([1, 3, 5]);
        const [checklist, setChecklist] = useState(portalData.checklist);

        const handleToggleDsa = (id) => {
          setCompletedDsaIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
        };

        const handleToggleChecklist = (id) => {
          setChecklist(prev => prev.map(item => item.id === id ? { ...item, done: !item.done } : item));
        };

        const totalDsa = portalData.dsaQuestions.length;
        const completedDsaCount = completedDsaIds.length;
        const totalChecklist = checklist.length;
        const completedChecklistCount = checklist.filter(c => c.done).length;
        const readinessScore = Math.min(100, Math.round(((completedDsaCount / totalDsa) * 50) + ((completedChecklistCount / totalChecklist) * 50)));

        return (
          <div className="app-wrapper">
            <Navbar portalInfo={portalData.portalInfo} activeTab={activeTab} setActiveTab={setActiveTab} />
            <main className="main-content">
              {activeTab === 'dashboard' && (
                <Dashboard
                  portalInfo={portalData.portalInfo}
                  stats={portalData.stats}
                  readinessScore={readinessScore}
                  completedDsaCount={completedDsaCount}
                  completedChecklistCount={completedChecklistCount}
                  totalChecklistCount={totalChecklist}
                  setActiveTab={setActiveTab}
                />
              )}
              {activeTab === 'companies' && <CompanyTracks companies={portalData.companies} />}
              {activeTab === 'dsa' && (
                <DsaPractice
                  questions={portalData.dsaQuestions}
                  completedIds={completedDsaIds}
                  onToggleComplete={handleToggleDsa}
                  onSelectQuestion={q => setSelectedQuestion(q)}
                />
              )}
              {activeTab === 'aptitude' && <AptitudeQuiz quizzes={portalData.quizzes} />}
              {activeTab === 'core' && <CoreSubjects subjects={portalData.coreSubjects} />}
              {activeTab === 'interview' && <InterviewGuide questions={portalData.interviewQuestions} />}
              {activeTab === 'checklist' && (
                <ChecklistTracker
                  checklist={checklist}
                  onToggleItem={handleToggleChecklist}
                  completedCount={completedChecklistCount}
                  totalCount={totalChecklist}
                />
              )}
            </main>
            {selectedQuestion && <QuestionModal question={selectedQuestion} onClose={() => setSelectedQuestion(null)} />}
            <footer className="footer">
              <p>
                <strong>{portalData.portalInfo.title}</strong> — {portalData.portalInfo.tagline} • Developed by {portalData.portalInfo.studentName} ({portalData.portalInfo.studentId})
              </p>
              <p style={{ marginTop: '0.25rem', color: 'var(--text-light)', fontSize: '0.75rem' }}>
                Assignment 2 Individual Project • React.js + CSS + Dummy JSON Data
              </p>
            </footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<MainApp />);
    }

    // Load data.json as script object for file:// execution fallback
    fetch('./data.json')
      .then(res => res.json())
      .then(data => { window.PREP_DATA = data; initApp(); })
      .catch(() => {
        // Fallback script tag loading or inline initialization
        const script = document.createElement('script');
        script.src = './data.json';
        initApp();
      });
  </script>
</body>
</html>
